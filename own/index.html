<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Owen // Birthday Editions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #070807;
        --ink: #f2f2f0;
        --muted: #8a938a;
        --green: #2fbf55;
        --cream: #e8dcc8;
        --red: #c62828;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        color: var(--ink);
        font-family: "Space Grotesk", system-ui, sans-serif;
        background:
          radial-gradient(ellipse at 20% 20%, rgba(47, 191, 85, 0.12), transparent 45%),
          radial-gradient(ellipse at 80% 70%, rgba(198, 40, 40, 0.1), transparent 40%),
          linear-gradient(160deg, #050705 0%, #0c100c 50%, #08070a 100%);
      }

      .chooser {
        width: min(28rem, 100%);
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.72rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(1.8rem, 6vw, 2.4rem);
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .lede {
        margin: 0 0 2rem;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.45;
      }

      .editions {
        display: grid;
        gap: 0.85rem;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .editions a {
        display: block;
        padding: 1rem 1.15rem;
        border: 1px solid rgba(242, 242, 240, 0.14);
        text-decoration: none;
        color: var(--ink);
        background: rgba(8, 12, 9, 0.72);
        transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
      }

      .editions a:hover {
        transform: translateY(-2px);
        border-color: rgba(47, 191, 85, 0.55);
        background: rgba(12, 20, 14, 0.9);
      }

      .editions a.cmiygl:hover {
        border-color: rgba(232, 220, 200, 0.55);
      }

      .editions .label {
        display: block;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.68rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 0.35rem;
      }

      .editions .title {
        display: block;
        font-size: 1.1rem;
        font-weight: 700;
      }

      .editions .chroma .title {
        color: var(--green);
      }

      .editions .cmiygl .title {
        color: var(--cream);
      }
    </style>
  </head>
  <body>
    <main class="chooser">
      <p class="eyebrow">Owen · birthday editions</p>
      <h1>Pick a set</h1>
      <p class="lede">Two vibes. Same birthday. Choose your entrance.</p>
      <ul class="editions">
        <li>
          <a class="chroma" href="chromakopia.html">
            <span class="label">chromakopia.html</span>
            <span class="title">St. Birthday (Chromakopia)</span>
          </a>
        </li>
        <li>
          <a class="cmiygl" href="cmiygl.html">
            <span class="label">cmiygl.html</span>
            <span class="title">Call Me If You Get Famous</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
